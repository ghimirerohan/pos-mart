openapi: 3.0.3
info:
  title: KLiK POS API
  version: "1.0.0"
  description: |
    API surface used by the KLiK POS React SPA and related Frappe/ERPNext integrations.

    Try it out — behavior on this page:
    - GET requests are sent to your real Frappe site (live data). Use Authorize with a Frappe API token: token api_key:api_secret (generate from User → API Access).
    - POST, PUT, DELETE, PATCH to /api/* are intercepted in the browser and return static mock JSON only. No documents are created, updated, or deleted. This is intentional for safe demos.

    Session isolation:
    Token auth uses the Authorization header only; it does not log you into the POS SPA or Desk. Opening /klik_pos or /login still requires normal login.

servers:
  - url: /
    description: Same origin (current Frappe site)

tags:
  - name: AuthAndSession
    description: Login helpers, CSRF, current user (Frappe + klik_pos)
  - name: POSSession
    description: POS open / opening / closing entry
  - name: POSProfileTax
    description: POS profile and tax categories
  - name: Payments
    description: Payment modes and shift payment data
  - name: CatalogPricing
    description: Items, stock, barcodes, pricing rules
  - name: ItemManagement
    description: Item CRUD helpers for the SPA item screens
  - name: Customers
    description: Customer search and maintenance
  - name: SalesInvoices
    description: Sales invoices, payments, returns
  - name: DashboardAnalytics
    description: Dashboard KPIs and drilldowns
  - name: Purchase
    description: Purchase invoices
  - name: Suppliers
    description: Suppliers
  - name: DateWiseInventory
    description: Date-wise inventory report API
  - name: Delivery
    description: Delivery personnel
  - name: Communications
    description: Email, WhatsApp, SMS
  - name: Outstanding
    description: Receive outstanding payments
  - name: Cache
    description: Backend cache utilities
  - name: FrappeClient
    description: Generic Frappe client / resource APIs used by the SPA

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Frappe token authentication. Value must be exactly:
        `token <api_key>:<api_secret>`
        (no brackets). Generate keys from the User document → API Access.

  schemas:
    FrappeStandardResponse:
      type: object
      description: Typical Frappe JSON response; shape varies by method.
      additionalProperties: true
    MockNotice:
      type: object
      required: [_mock, _message]
      properties:
        _mock:
          type: boolean
          example: true
        _message:
          type: string
          example: "Swagger UI demo — this response was not generated by the server."

security:
  - tokenAuth: []

paths:
  /api/method/frappe.auth.get_logged_user:
    get:
      tags:
        - AuthAndSession
      summary: "Get logged-in user"
      description: |
            Returns the current user id if session is valid; with token auth returns the API user.
      parameters: []
      responses:
        "200":
          description: Success (live response from Frappe when using Try it out on this page)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrappeStandardResponse"
        "401":
          description: Unauthorized / invalid token
        "403":
          description: Forbidden
  /api/method/frappe.client.get_list:
    post:
      tags:
        - FrappeClient
      summary: "Generic get_list"
      description: |
        List any doctype.

        DEMO MODE (this page only): When you use Try it out / Execute for this operation on
        `/klik_pos/api-docs`, the browser returns a static mock response and does not call
        the real server. No data is mutated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              {
                "doctype": "UOM",
                "fields": [
                  "name"
                ],
                "limit_page_length": 20
              }
      responses:
        "200":
          description: Mock response only (browser interceptor on api-docs page)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrappeStandardResponse"
              example:
                _mock: true
                message:
                  success: true
